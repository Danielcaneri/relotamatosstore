<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b1425">
<title>MATOS STORE • Roleta</title>
<style>
:root{--bg:#0b1425;--panel:#12223b;--panel2:#172b48;--blue:#367bd5;--blue2:#69adff;--text:#edf4ff;--muted:#91aaca;--line:#8dbdff24}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 80% 0%,#1a3b64 0,transparent 32%),linear-gradient(145deg,#0b1425,#10213b 58%,#081321);color:var(--text);font-family:Inter,system-ui,Segoe UI,sans-serif;overflow-x:hidden}button,input{font:inherit}button{cursor:pointer;border:0}.intro{position:fixed;inset:0;z-index:50;background:radial-gradient(circle at center,#1d4775,#08111f 72%);display:grid;place-items:center;animation:introOut .65s ease 2.7s forwards}.intro h1{font-family:Impact,'Arial Narrow Bold',sans-serif;font-size:clamp(38px,8vw,76px);letter-spacing:2px;margin:0;text-shadow:0 8px 35px #0008;animation:pop .8s cubic-bezier(.2,.8,.2,1) both}.intro-line{height:3px;width:0;background:var(--blue2);border-radius:4px;margin:20px auto;box-shadow:0 0 20px var(--blue);animation:grow 1.7s ease .3s forwards}@keyframes pop{from{opacity:0;transform:translateY(24px) scale(.92)}to{opacity:1;transform:none}}@keyframes introOut{to{opacity:0;visibility:hidden;pointer-events:none}}@keyframes grow{to{width:100%}}.wrap{max-width:1180px;margin:auto;padding:28px 22px 50px}.top{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:28px}.brand{display:flex;align-items:center;gap:13px}.mark{width:54px;height:54px;border-radius:15px;display:grid;place-items:center;background:linear-gradient(145deg,#438ce9,#183b68);border:1px solid #9bc7ff55;box-shadow:0 8px 25px #0005;font-family:Impact,sans-serif;font-size:23px}.brand h1{font:30px Impact,'Arial Narrow Bold',sans-serif;letter-spacing:1px;margin:0}.brand p{margin:4px 0 0;font-size:10px;letter-spacing:2px;color:var(--muted)}.status{font-size:11px;color:#9ec5ff;background:#17345a;border:1px solid #315b8d;padding:9px 13px;border-radius:30px}.status:before{content:'';display:inline-block;width:7px;height:7px;background:#5de0a0;border-radius:50%;margin-right:8px;box-shadow:0 0 10px #5de0a0}.heading{text-align:center;margin:20px 0 27px}.heading h2{font:clamp(30px,5vw,46px) Impact,sans-serif;letter-spacing:1px;margin:0 0 8px}.heading p{margin:0;color:var(--muted);font-size:13px}.layout{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(280px,.7fr);gap:18px;align-items:start}.panel{background:linear-gradient(145deg,#172b48eF,#10213aF2);border:1px solid var(--line);border-radius:20px;box-shadow:0 18px 50px #0003;overflow:hidden}.panel-head{padding:17px 20px;border-bottom:1px solid #ffffff12;display:flex;justify-content:space-between;align-items:center}.panel-head h3{font-size:14px;margin:0}.panel-head span{font-size:10px;color:var(--muted)}.wheel-area{padding:25px 20px 23px;display:flex;flex-direction:column;align-items:center}.wheel-box{width:min(100%,470px);aspect-ratio:1;position:relative;display:grid;place-items:center;filter:drop-shadow(0 15px 25px #0006)}canvas{width:100%;height:100%;display:block}.pointer{position:absolute;z-index:2;top:-9px;left:50%;transform:translateX(-50%);width:0;height:0;border-left:17px solid transparent;border-right:17px solid transparent;border-top:34px solid #eaf4ff;filter:drop-shadow(0 3px 5px #0008)}.hub{position:absolute;width:19%;aspect-ratio:1;border-radius:50%;background:linear-gradient(145deg,#eaf4ff,#8bbdff);border:7px solid #17345a;box-shadow:0 0 0 3px #8fc0ff88,0 0 25px #367bd588;pointer-events:none}.spin{margin-top:23px;padding:15px 45px;border-radius:13px;background:linear-gradient(135deg,#438ce9,#2864b7);color:white;font-weight:850;letter-spacing:1px;box-shadow:0 9px 26px #2769bd55;transition:.2s}.spin:hover{transform:translateY(-2px);filter:brightness(1.12)}.spin:disabled{opacity:.55;cursor:not-allowed;transform:none}.hint{font-size:11px;color:var(--muted);margin:12px 0 0;text-align:center}.options{padding:17px}.add-row{display:flex;gap:8px;margin-bottom:12px}.add-row input{flex:1;min-width:0;background:#0c192c;border:1px solid #2b4566;color:var(--text);padding:11px 12px;border-radius:10px;outline:none}.add-row input:focus{border-color:#5598ef;box-shadow:0 0 0 3px #367bd526}.add-btn{background:#367bd5;color:#fff;border-radius:10px;padding:0 15px;font-weight:750}.list{display:grid;gap:8px;max-height:330px;overflow:auto}.item{display:flex;align-items:center;gap:10px;padding:10px 11px;background:#0d1b2e;border:1px solid #ffffff10;border-radius:10px}.dot{width:11px;height:11px;border-radius:4px;flex:none}.item-name{flex:1;min-width:0;font-size:12px;overflow-wrap:anywhere}.remove{background:#ffffff0c;color:#9fb7d6;width:27px;height:27px;border-radius:8px;font-size:17px}.remove:hover{background:#74384a;color:#fff}.tools{display:flex;justify-content:space-between;gap:8px;margin-top:13px}.small-btn{background:#ffffff0b;border:1px solid #ffffff18;color:#cfe0f7;padding:9px 11px;border-radius:9px;font-size:11px}.small-btn:hover{background:#ffffff18}.count{font-size:10px;color:var(--muted);align-self:center}.foot{text-align:center;color:#6f8bad;font-size:10px;margin-top:24px;letter-spacing:1px}.result{position:fixed;inset:0;z-index:30;background:#030914d9;backdrop-filter:blur(9px);display:none;place-items:center;padding:20px}.result.show{display:grid}.result-card{position:relative;width:min(100%,520px);padding:40px 25px 35px;text-align:center;border-radius:24px;background:linear-gradient(145deg,#1c3b61,#10213a);border:1px solid #8fc0ff55;box-shadow:0 25px 90px #000a;overflow:hidden;animation:resultPop .55s cubic-bezier(.2,.9,.2,1) both}.result-card:before{content:'';position:absolute;inset:-50%;background:conic-gradient(from 0deg,transparent,#67adff22,transparent 35%);animation:shine 5s linear infinite;pointer-events:none}.result-card>*{position:relative}.close{position:absolute;z-index:3;right:13px;top:12px;width:36px;height:36px;border-radius:50%;background:#ffffff17;color:white;font-size:23px;line-height:1}.close:hover{background:#ffffff30}.trophy{font-size:38px;margin-bottom:10px;filter:drop-shadow(0 0 14px #8fc0ff)}.result-label{color:#9fcaff;font-size:11px;font-weight:800;letter-spacing:3px}.winner{font:clamp(32px,7vw,55px) Impact,sans-serif;letter-spacing:1px;margin:13px 0 22px;overflow-wrap:anywhere;text-shadow:0 5px 24px #0008;animation:winnerIn .65s .15s both}.result-ok{padding:12px 26px;border-radius:11px;background:linear-gradient(135deg,#438ce9,#2864b7);color:#fff;font-weight:800}@keyframes resultPop{from{opacity:0;transform:translateY(20px) scale(.85)}to{opacity:1;transform:none}}@keyframes winnerIn{from{opacity:0;transform:scale(.5);filter:blur(8px)}to{opacity:1;transform:scale(1);filter:blur(0)}}@keyframes shine{to{transform:rotate(360deg)}}.bolt{position:fixed;z-index:29;pointer-events:none;width:3px;height:150px;background:linear-gradient(transparent,#e6f4ff,#68b4ff,transparent);filter:drop-shadow(0 0 7px #67b4ff) drop-shadow(0 0 15px #367bd5);opacity:0;transform-origin:top;animation:boltFlash .65s ease-out forwards}.bolt:after{content:'';position:absolute;left:0;top:15%;width:3px;height:70%;background:#fff;transform:rotate(24deg);box-shadow:0 0 12px #fff}@keyframes boltFlash{0%{opacity:0;transform:scaleY(.1) rotate(var(--rot))}20%{opacity:1}100%{opacity:0;transform:scaleY(1) rotate(var(--rot))}}.empty{text-align:center;color:var(--muted);font-size:12px;padding:25px 8px}@media(max-width:800px){.layout{grid-template-columns:1fr}.top{align-items:flex-start}.status{font-size:10px}.wheel-box{width:min(100%,420px)}}@media(max-width:430px){.wrap{padding:19px 13px 35px}.brand h1{font-size:24px}.mark{width:46px;height:46px}.heading{margin:16px 0 21px}.wheel-area{padding:20px 12px}.spin{width:100%}}
</style>
</head>
<body>
<div class="intro"><div><h1>MATOS STORE</h1><div class="intro-line"></div></div></div>
<main class="wrap">
<header class="top"><div class="brand"><div class="mark">MS</div><div><h1>MATOS STORE</h1><p>ROLETA DE SORTEIO</p></div></div><div class="status">SISTEMA ONLINE</div></header>
<section class="heading"><h2>ROLETA DA SORTE</h2><p>Adicione as opções, gire a roleta e descubra quem será o escolhido.</p></section>
<div class="layout">
<section class="panel"><div class="panel-head"><h3>ROLETA</h3><span>GIRE E BOA SORTE</span></div><div class="wheel-area"><div class="wheel-box"><div class="pointer"></div><canvas id="wheel" width="900" height="900"></canvas><div class="hub"></div></div><button class="spin" id="spin">GIRAR ROLETA</button><p class="hint">A roleta precisa ter pelo menos 2 opções.</p></div></section>
<aside class="panel"><div class="panel-head"><h3>OPÇÕES DO SORTEIO</h3><span id="count">6 opções</span></div><div class="options"><form class="add-row" id="addForm"><input id="newOption" maxlength="42" placeholder="Digite uma opção..." autocomplete="off"><button class="add-btn" type="submit">ADICIONAR</button></form><div class="list" id="list"></div><div class="tools"><button class="small-btn" id="reset">RESTAURAR EXEMPLO</button><span class="count" id="total">6 itens</span></div></div></aside>
</div><footer class="foot">MATOS STORE</footer>
</main>
<div class="result" id="result" role="dialog" aria-modal="true"><div class="result-card"><button class="close" id="close" aria-label="Fechar">×</button><div class="trophy">🏆</div><div class="result-label">O RESULTADO SAIU!</div><div class="winner" id="winner">VENCEDOR</div><button class="result-ok" id="ok">FECHAR</button></div></div>
<script>
const colors=['#367bd5','#244f83','#4b91e4','#19385f','#6aaeff','#2c669f','#315d91','#1c2f4a','#438ce9','#25436a'];
let options=['Participante 1','Participante 2','Participante 3','Participante 4','Participante 5','Participante 6'];let angle=0,spinning=false;const canvas=document.getElementById('wheel'),ctx=canvas.getContext('2d');const list=document.getElementById('list'),count=document.getElementById('count'),total=document.getElementById('total'),spinBtn=document.getElementById('spin');
function draw(){const n=options.length,w=canvas.width,c=w/2,r=w/2-15;ctx.clearRect(0,0,w,w);if(!n){ctx.beginPath();ctx.arc(c,c,r,0,Math.PI*2);ctx.fillStyle='#203a5d';ctx.fill();ctx.fillStyle='#dceaff';ctx.font='bold 34px Arial';ctx.textAlign='center';ctx.fillText('ADICIONE OPÇÕES',c,c);return}const step=Math.PI*2/n;for(let i=0;i<n;i++){const start=angle+i*step-Math.PI/2;ctx.beginPath();ctx.moveTo(c,c);ctx.arc(c,c,r,start,start+step);ctx.closePath();ctx.fillStyle=colors[i%colors.length];ctx.fill();ctx.strokeStyle='#d9eaff55';ctx.lineWidth=4;ctx.stroke();ctx.save();ctx.translate(c,c);ctx.rotate(start+step/2);ctx.textAlign='right';ctx.fillStyle='#fff';ctx.shadowColor='#0008';ctx.shadowBlur=5;let size=Math.max(19,Math.min(31,360/n));ctx.font=`800 ${size}px Arial`;let label=options[i];while(ctx.measureText(label).width>r*.78&&label.length>8)label=label.slice(0,-2)+'…';ctx.fillText(label,r-32,10);ctx.restore()}ctx.beginPath();ctx.arc(c,c,r,0,Math.PI*2);ctx.strokeStyle='#a9d2ff';ctx.lineWidth=12;ctx.stroke();}
function renderList(){list.innerHTML='';options.forEach((name,i)=>{const row=document.createElement('div');row.className='item';const dot=document.createElement('span');dot.className='dot';dot.style.background=colors[i%colors.length];const label=document.createElement('span');label.className='item-name';label.textContent=name;const remove=document.createElement('button');remove.className='remove';remove.textContent='×';remove.title='Remover opção';remove.disabled=spinning;remove.onclick=()=>{options.splice(i,1);render()};row.append(dot,label,remove);list.append(row)});if(!options.length)list.innerHTML='<div class="empty">Nenhuma opção adicionada ainda.</div>';count.textContent=`${options.length} ${options.length===1?'opção':'opções'}`;total.textContent=`${options.length} ${options.length===1?'item':'itens'}`;spinBtn.disabled=spinning||options.length<2;draw()}
function render(){renderList()}
document.getElementById('addForm').addEventListener('submit',e=>{e.preventDefault();const input=document.getElementById('newOption');const value=input.value.trim();if(!value||spinning)return;options.push(value);input.value='';render()});
document.getElementById('reset').onclick=()=>{if(spinning)return;options=['Participante 1','Participante 2','Participante 3','Participante 4','Participante 5','Participante 6'];angle=0;render()};
function lightning(){for(let i=0;i<9;i++){const b=document.createElement('div');b.className='bolt';b.style.left=(8+Math.random()*84)+'vw';b.style.top=(Math.random()*45)+'vh';b.style.setProperty('--rot',(Math.random()*48-24)+'deg');b.style.height=(90+Math.random()*180)+'px';b.style.animationDelay=(Math.random()*.22)+'s';document.body.append(b);setTimeout(()=>b.remove(),1100)}}
function showWinner(name){document.getElementById('winner').textContent=name;const modal=document.getElementById('result');modal.classList.add('show');lightning()}
function closeResult(){document.getElementById('result').classList.remove('show')};document.getElementById('close').onclick=closeResult;document.getElementById('ok').onclick=closeResult;document.getElementById('result').addEventListener('click',e=>{if(e.target.id==='result')closeResult()});document.addEventListener('keydown',e=>{if(e.key==='Escape')closeResult()});
spinBtn.onclick=()=>{if(spinning||options.length<2)return;spinning=true;renderList();const winnerIndex=Math.floor(Math.random()*options.length);const n=options.length,step=Math.PI*2/n;const desired=-((winnerIndex+.5)*step);let current=((angle%(Math.PI*2))+Math.PI*2)%(Math.PI*2);let target=desired;while(target<current)target+=Math.PI*2;const extra=7+Math.floor(Math.random()*4);const finalAngle=angle+(target-current)+extra*Math.PI*2;const start=angle,delta=finalAngle-start,duration=5700+Math.random()*700,t0=performance.now();function frame(now){const p=Math.min(1,(now-t0)/duration);const eased=1-Math.pow(1-p,5);angle=start+delta*eased;draw();if(p<1)requestAnimationFrame(frame);else{angle=((angle%(Math.PI*2))+Math.PI*2)%(Math.PI*2);spinning=false;renderList();showWinner(options[winnerIndex])}}requestAnimationFrame(frame)};
render();
</script>
</body></html>
